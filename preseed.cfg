# Ubuntu 20.04.1 LEGACY server amd64 (debian-installer), not Subiquity YAML.
# NEW TEMPLATE: DHCP + nginx variant; statically checked, NOT install-tested.
# DANGER: automatically ERASES ALL DATA on guest /dev/vda without confirmation.
# Intended ONLY for a disposable VM with ONE blank virtio disk (12 GiB or more).
# Never boot this unchanged on a physical machine or a VM with valuable disks.
# Fill all three REPLACE_ values below before embedding at /preseed.cfg in ISO.
# Do not reuse real credentials. The hash is readable by anyone with this media.

# Stop at the preseed stage if account placeholders were left in this file.
# This error check is not a substitute for checking disk attachments yourself.
d-i preseed/early_command string if grep -q '^d-i passwd/.*REPLACE_' /cdrom/preseed.cfg; then echo 'Fill account placeholders before installation.' > /dev/console; exit 1; fi

# Locale / console / clock
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Wired DHCP; installer selects a linked interface. DHCP server and DNS required.
# Review auto selection if the VM has multiple NICs. No static address or Wi-Fi.
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string nginx-demo
d-i netcfg/hostname string nginx-demo
d-i netcfg/get_domain string localdomain
d-i hw-detect/load_firmware boolean false

# Create a normal sudo-capable user; disable direct root login.
# Username: lowercase Linux login name. Generate a fresh SHA-512 crypt hash.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string REPLACE_WITH_DISPLAY_NAME
d-i passwd/username string REPLACE_WITH_USERNAME
d-i passwd/user-password-crypted password REPLACE_WITH_SHA512_PASSWORD_HASH
d-i user-setup/encrypt-home boolean false

# DESTRUCTIVE: guest disk /dev/vda is reformatted in full. No interactive check.
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Canonical focal archive metadata checked 2026-10-07. Recheck before later use.
# HTTP transport uses APT signature verification; do not allow unauthenticated apt.
d-i apt-setup/use_mirror boolean true
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string
d-i mirror/suite string focal
d-i apt-setup/universe boolean true
d-i apt-setup/restricted boolean false
d-i apt-setup/multiverse boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.ubuntu.com

# Basic utilities plus nginx. No SSH server, GUI or blockchain software.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string nginx
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select none
d-i pkgsel/language-packs multiselect
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false

# Bootloader and completion: normal reboot, no recurring proof/poweroff service.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/vda
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
d-i debian-installer/exit/poweroff boolean false

# Self-contained late command, executed INSIDE installed target via in-target.
# Replace nginx's fresh default site; serve static HTML on IPv4 TCP 80.
# Validate config and enable at boot. No --now, firewall changes or port forwards.
d-i preseed/late_command string \
    in-target /bin/sh -c 'set -eu; \
    mkdir -p /var/www/html; \
    printf "%s\n" "<!doctype html>" "<html lang=\"en\"><meta charset=\"utf-8\"><title>nginx demo</title><body><h1>nginx demo is running</h1><p>Provisioned by a legacy Ubuntu preseed template.</p></body></html>" > /var/www/html/index.html; \
    printf "%s\n" "server {" "    listen 80 default_server;" "    server_name _;" "    root /var/www/html;" "    index index.html;" "}" > /etc/nginx/sites-available/default; \
    ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default; \
    chmod 0644 /var/www/html/index.html /etc/nginx/sites-available/default; \
    nginx -t; \
    systemctl enable nginx.service'
